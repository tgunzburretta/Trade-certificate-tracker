name: Send certificate renewal reminders

on:
  schedule:
    # 07:00 UTC daily. Checks every tracked certificate and emails whoever
    # crosses the 60/30/7-day threshold (each window fires once per cert).
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminders endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${APP_URL}/api/cron/reminders" \
            -H "x-cron-secret: ${CRON_SECRET}")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Reminder endpoint returned HTTP $status"
            exit 1
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
