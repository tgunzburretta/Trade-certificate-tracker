# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploying: in Render, New > Blueprint, connect this repo, and Render reads
# this file. It will prompt for the values marked `sync: false` and generate
# the two secrets itself.
#
# Migrations run in the build command rather than as a pre-deploy step so this
# works on the free instance type. They are idempotent — `migrate deploy`
# applies only what is outstanding.
services:
  - type: web
    name: vetted
    runtime: node
    plan: free # upgrade to `starter` to stop the service sleeping after 15 minutes
    region: frankfurt # closest Render region to the UK
    branch: claude/cert-renewal-tracker-trades-391ga3
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Postgres connection string, e.g. from Neon.
      - key: DATABASE_URL
        sync: false

      # Generated by Render as a random 256-bit value — nothing to invent.
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

      # Your real https:// domain. Session cookies are only marked Secure when
      # this starts with https, so it must be the live URL, not a placeholder.
      - key: APP_URL
        sync: false

      # Email. Without these nothing is actually sent — reminders, verification
      # links and password resets are only logged.
      - key: RESEND_API_KEY
        sync: false
      - key: REMINDER_FROM_EMAIL
        sync: false

      # Uploaded certificates. Without these, documents go to the container's
      # disk and are destroyed on the next deploy.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

      # Free Companies House key — business verification stays dormant without it.
      - key: COMPANIES_HOUSE_API_KEY
        sync: false
